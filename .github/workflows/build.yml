name: Build Privacy Keyboard APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK
        run: |
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Generate and build
        run: |
          mkdir -p app/src/main/java/com/auxenstudio/privacykeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          printf 'rootProject.name = "PrivacyKeyboard"\ninclude ":app"\n' > settings.gradle
          printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies {\n    classpath "com.android.tools.build:gradle:8.2.0"\n    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n  }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle
          printf 'android.useAndroidX=true\n' > gradle.properties
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          printf 'apply plugin: "com.android.application"\napply plugin: "kotlin-android"\nandroid {\n  namespace "com.auxenstudio.privacykeyboard"\n  compileSdk 34\n  defaultConfig {\n    applicationId "com.auxenstudio.privacykeyboard"\n    minSdk 26; targetSdk 34; versionCode 1; versionName "1.0"\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions { jvmTarget = "17" }\n}\ndependencies {\n  implementation "androidx.core:core-ktx:1.12.0"\n  implementation "com.google.android.material:material:1.11.0"\n}\n' > app/build.gradle
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <application android:allowBackup="false" android:label="Privacy Keyboard" android:theme="@style/Theme.AppCompat">\n    <activity android:name=".SettingsActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN"/>\n        <category android:name="android.intent.category.LAUNCHER"/>\n      </intent-filter>\n    </activity>\n    <service android:name=".PrivacyKeyboardService" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">\n      <intent-filter><action android:name="android.view.InputMethod"/></intent-filter>\n      <meta-data android:name="android.view.im" android:resource="@xml/method"/>\n    </service>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<input-method xmlns:android="http://schemas.android.com/apk/res/android">\n  <subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard"/>\n</input-method>\n' > app/src/main/res/xml/method.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">Privacy Keyboard</string></resources>\n' > app/src/main/res/values/strings.xml
          cat > app/src/main/java/com/auxenstudio/privacykeyboard/SettingsActivity.kt << 'KT'
          package com.auxenstudio.privacykeyboard
          import android.app.Activity; import android.os.Bundle
          import android.view.inputmethod.InputMethodManager
          import android.widget.*; import android.graphics.Color
          class SettingsActivity : Activity() {
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              val root = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                setBackgroundColor(Color.parseColor("#0D0D0F"))
                setPadding(48,80,48,48)
              }
              root.addView(TextView(this).apply {
                text = "PRIVACY KEYBOARD"; textSize = 20f
                setTextColor(Color.parseColor("#39FF14"))
              })
              val btn = Button(this).apply {
                text = "ENABLE KEYBOARD"; setTextColor(Color.BLACK)
                backgroundTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#39FF14"))
              }
              btn.setOnClickListener { (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
              root.addView(btn); setContentView(root)
            }
          }
          KT
          cat > app/src/main/java/com/auxenstudio/privacykeyboard/PrivacyKeyboardService.kt << 'KT'
          package com.auxenstudio.privacykeyboard
          import android.graphics.Color; import android.inputmethodservice.InputMethodService
          import android.os.*; import android.util.TypedValue; import android.view.*; import android.widget.*
          class PrivacyKeyboardService : InputMethodService() {
            private val rows = listOf(
              listOf("1","2","3","4","5","6","7","8","9","0"),
              listOf("q","w","e","r","t","y","u","i","o","p"),
              listOf("a","s","d","f","g","h","j","k","l"),
              listOf("z","x","c","v","b","n","m"))
            private var shift = false
            override fun onCreateInputView(): View {
              val root = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                setBackgroundColor(Color.parseColor("#0D0D0F")); setPadding(4,4,4,8)
              }
              root.addView(TextView(this).apply {
                text = "OFFLINE - NO TELEMETRY"; textSize = 9f
                setTextColor(Color.parseColor("#39FF14")); setPadding(12,6,12,6)
              })
              rows.forEach { row ->
                root.addView(LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; setPadding(0,2,0,2)
                  row.forEach { k -> addView(Button(this@PrivacyKeyboardService).apply {
                    text = if(shift) k.uppercase() else k; textSize = 14f; isAllCaps = false
                    setTextColor(Color.parseColor("#E8E8EC"))
                    backgroundTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#1A1A20"))
                    setPadding(0,0,0,0)
                    layoutParams = LinearLayout.LayoutParams(0,dp(44)).apply { weight=1f; setMargins(2,2,2,2) }
                    setOnClickListener { currentInputConnection?.commitText(if(shift) k.uppercase() else k,1); if(shift){shift=false}; vib() }
                  })}
                })
              }
              root.addView(LinearLayout(this).apply {
                orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; setPadding(0,2,0,2)
                addView(kb("SHF",52,"#1C1825"){shift=!shift;vib()})
                addView(Button(this@PrivacyKeyboardService).apply {
                  text="SPACE";textSize=11f;isAllCaps=false
                  setTextColor(Color.parseColor("#E8E8EC"))
                  backgroundTintList=android.content.res.ColorStateList.valueOf(Color.parseColor("#1A1A20"))
                  layoutParams=LinearLayout.LayoutParams(0,dp(44)).apply{weight=1f;setMargins(2,2,2,2)}
                  setOnClickListener{currentInputConnection?.commitText(" ",1)}
                })
                addView(kb("DEL",52,"#1C1825"){currentInputConnection?.deleteSurroundingText(1,0);vib()})
                addView(kb("OK",60,"#39FF14"){currentInputConnection?.commitText("\n",1)})
              })
              return root
            }
            private fun kb(l:String,w:Int,c:String,f:()->Unit)=Button(this).apply{
              text=l;textSize=13f;isAllCaps=false
              setTextColor(if(c=="#39FF14")Color.BLACK else Color.parseColor("#E8E8EC"))
              backgroundTintList=android.content.res.ColorStateList.valueOf(Color.parseColor(c))
              layoutParams=LinearLayout.LayoutParams(dp(w),dp(44)).apply{setMargins(2,2,2,2)}
              setOnClickListener{f()}
            }
            private fun vib()=try{
              if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.S)
                (getSystemService(VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator.vibrate(VibrationEffect.createOneShot(18,VibrationEffect.DEFAULT_AMPLITUDE))
              else @Suppress("DEPRECATION")(getSystemService(VIBRATOR_SERVICE) as Vibrator).vibrate(18)
            }catch(e:Exception){}
            private fun dp(v:Int)=TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP,v.toFloat(),resources.displayMetrics).toInt()
          }
          KT
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/
          /tmp/gradle-8.4/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyKeyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
